      let mm = null;
      let retryCount = 0;
      const maxRetries = 3;

      function initMindmap() {
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');

        if (typeof markmap === 'undefined' || typeof markmap.Markmap === 'undefined') {
          retryCount++;
          if (retryCount <= maxRetries) {
            setTimeout(initMindmap, 2000);
          } else {
            loading.style.display = 'none';
            errorMsg.style.display = 'block';
          }
          return;
        }

        loading.style.display = 'none';
        errorMsg.style.display = 'none';

        try {
          mm = markmap.Markmap.create(
            "svg#mindmap",
            {
              color: () => {
                const colors = ['#f472b6', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#fb923c', '#f87171', '#2dd4bf'];
                return colors[Math.floor(Math.random() * colors.length)];
              },
              initialExpandLevel: 10,
              maxWidth: 400,
              nodeMinHeight: 24,
              spacingVertical: 5,
              spacingHorizontal: 12,
              paddingX: 12,
              paddingY: 6,
              style: "font-size: 12px; line-height: 1.4;",
              zoom: true,
              zoomOnClick: true,
              pan: true,
              fitRatio: 0.85
            },
            data
          );

          setTimeout(() => { mm.fit(); }, 300);

          setTimeout(() => {
            try {
              const { Toolbar } = markmap;
              const toolbar = Toolbar.create(mm);
              toolbar.setAttribute('style', 'position:fixed;bottom:20px;right:20px;z-index:100');
              document.body.append(toolbar);
            } catch(e) { /* toolbar optional */ }
          }, 500);
        } catch(e) {
          errorMsg.innerHTML = '<div style="font-size:24px;margin-bottom:12px;">❌</div><div>加载失败：' + e.message + '</div><button id="retry-btn" onclick="location.reload()">重试</button>';
          errorMsg.style.display = 'block';
          loading.style.display = 'none';
        }
      }

      window.addEventListener('load', () => {
        setTimeout(initMindmap, 500);
      });

      // 如果页面已经加载完毕
      if (document.readyState === 'complete') {
        setTimeout(initMindmap, 500);
      }
    })();
